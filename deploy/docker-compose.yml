# KopsisKu — stack backend (TERISOLASI dari project YAW).
#
# Cara pakai:
#   cp .env.example .env      # lalu isi password di .env
#   podman-compose up -d --build
#
# Container di sini memakai prefix "koperasi_" sehingga tidak pernah
# tabrakan dengan container YAW (yaw_web_1, yaw_db_1, ...).

services:
  db:
    image: docker.io/library/mariadb:11
    container_name: koperasi_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-koperasi_siswa}
      MARIADB_USER: ${DB_USER:-koperasi}
      MARIADB_PASSWORD: ${DB_PASS:?Isi DB_PASS di file .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - koperasi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: koperasi_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Hanya diakses cloudflared lewat localhost — tidak dibuka ke publik.
      - "127.0.0.1:8081:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-koperasi}
      DB_PASS: ${DB_PASS:?Isi DB_PASS di file .env}
      DB_NAME: ${DB_NAME:-koperasi_siswa}
      # Diset explicit agar URL foto selalu https walau di balik tunnel.
      APP_SCHEME: https
      APP_HOST: ${APP_HOST:-koperasi.cnp.my.id}
      APP_PREFIX: /
    volumes:
      # Supaya foto tetap ada walau container dibuang & dibuat ulang.
      - koperasi_uploads:/var/www/html/backend/storage/uploads

volumes:
  koperasi_db_data:
  koperasi_uploads:
